<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Информатика Миллионері</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2e;
            --accent-blue: #00d2ff;
            --accent-green: #00ff88;
            --accent-red: #ff3366;
            --accent-gold: #ffcc00;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 210, 255, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 255, 136, 0.1) 0%, transparent 20%);
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.2);
            border: 1px solid rgba(0, 210, 255, 0.3);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--accent-blue);
            text-shadow: 0 0 10px var(--accent-blue);
            margin-bottom: 20px;
        }

        /* START SCREEN */
        .input-group {
            margin: 25px 0;
        }

        input[type="text"] {
            width: 80%;
            max-width: 400px;
            padding: 15px 20px;
            border-radius: 30px;
            border: 2px solid var(--accent-blue);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1.2rem;
            outline: none;
            text-align: center;
            box-shadow: inset 0 0 10px rgba(0, 210, 255, 0.2);
        }

        .btn {
            background: linear-gradient(45deg, #00d2ff, #0072ff);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.8);
        }

        /* GAME SCREEN */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .lifelines {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .lifeline-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--accent-blue);
            color: #fff;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .lifeline-btn:hover:not(:disabled) {
            background: var(--accent-blue);
            color: #000;
        }

        .lifeline-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #555;
        }

        .timer-container {
            font-size: 1.5rem;
            color: var(--accent-gold);
            margin-bottom: 15px;
            font-weight: bold;
        }

        .timer-warning {
            color: var(--accent-red) !important;
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        .question-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 15px;
            font-size: 1.3rem;
            margin-bottom: 25px;
            border: 1px solid rgba(0, 210, 255, 0.2);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
            .top-bar { flex-direction: column; gap: 10px; }
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s;
        }

        .option-btn:hover {
            background: rgba(0, 210, 255, 0.2);
            border-color: var(--accent-blue);
        }

        .option-btn.selected {
            background: rgba(255, 204, 0, 0.3);
            border-color: var(--accent-gold);
            animation: blink 0.3s infinite alternate;
        }

        .option-btn.correct {
            background: rgba(0, 255, 136, 0.4) !important;
            border-color: var(--accent-green) !important;
        }

        .option-btn.wrong {
            background: rgba(255, 51, 102, 0.4) !important;
            border-color: var(--accent-red) !important;
        }

        /* AUDIENCE POLL MODAL */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10;
        }

        .poll-results {
            width: 80%;
            max-width: 350px;
            text-align: left;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--accent-blue);
        }

        .poll-bar-container {
            margin: 10px 0;
        }

        .poll-bar {
            height: 20px;
            background: var(--accent-blue);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        /* END SCREEN */
        .final-score {
            font-size: 2rem;
            color: var(--accent-gold);
            margin: 20px 0;
            text-shadow: 0 0 10px var(--accent-gold);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        
        <!-- BASTAPQY EKRAN -->
        <div id="start-screen">
            <h1>💻 ИНФОРМАТИКА МИЛЛИОНЕРІ</h1>
            <p style="color: #aaa; margin-bottom: 20px;">Информатика пәнінен біліміңді сынап, миллионер атан!</p>
            <div class="input-group">
                <input type="text" id="player-name-input" placeholder="Аты-жөніңді енгіз..." autocomplete="off">
            </div>
            <button class="btn" id="start-btn">🚀 ОЙЫНДЫ БАСТАУ</button>
        </div>

        <!-- OYIN EKRANY -->
        <div id="game-screen" class="hidden">
            <div class="top-bar">
                <div>👤 <span id="player-display-name"></span></div>
                <div>📊 Сұрақ: <span id="question-number">1</span>/15</div>
                <div>💰 <span id="current-score">0</span> ұпай</div>
            </div>

            <div class="lifelines">
                <button class="lifeline-btn" id="life-5050">🌓 50/50</button>
                <button class="lifeline-btn" id="life-poll">👥 Сынып көмегі</button>
                <button class="lifeline-btn" id="life-swap">🔄 Сұрақты ауыстыру</button>
            </div>

            <div class="timer-container">
                ⏱️ Уақыт: <span id="timer">30</span> сек
            </div>

            <div class="question-box">
                <span id="question-text">Сұрақ жүктелуде...</span>
            </div>

            <div class="options-grid">
                <button class="option-btn" data-index="0">A: <span class="opt-text"></span></button>
                <button class="option-btn" data-index="1">B: <span class="opt-text"></span></button>
                <button class="option-btn" data-index="2">C: <span class="opt-text"></span></button>
                <button class="option-btn" data-index="3">D: <span class="opt-text"></span></button>
            </div>

            <button class="btn hidden" id="next-btn" style="margin-top: 20px;">Келесі сұрақ ➔</button>
        </div>

        <!-- REYTING/SOŃǴY EKRAN -->
        <div id="end-screen" class="hidden">
            <h1 id="end-title">ОЙЫН АЯҚТАЛДЫ!</h1>
            <p id="end-player-name" style="font-size: 1.3rem; margin-top: 10px;"></p>
            <div class="final-score" id="final-score-text">0 ҰПАЙ</div>
            <p id="correct-count-text" style="margin-bottom: 25px; color: #bbb;"></p>

            <div style="display: flex; gap: 15px; justify-content: center;">
                <button class="btn" id="restart-btn">🔄 Қайта ойнау</button>
                <button class="btn" id="home-btn" style="background: linear-gradient(45deg, #666, #333);">🏠 Басты бет</button>
            </div>
        </div>

        <!-- СЫНЫП КӨМЕГІ МОДАЛЬДЫ ОРНЫ -->
        <div class="modal" id="poll-modal">
            <h2 style="color: var(--accent-blue); margin-bottom: 15px;">👥 Сынып көмегі нәтижесі</h2>
            <div class="poll-results" id="poll-bars"></div>
            <button class="btn" id="close-poll-btn" style="margin-top: 20px; padding: 10px 25px;">Жабу</button>
        </div>

    </div>
</div>

<script>
    // 15 ҰПАЙЛАР ТІЗІМІ
    const prizeMoney = [
        100, 200, 300, 500, 1000, 
        2000, 4000, 8000, 16000, 32000, 
        64000, 125000, 250000, 500000, 1000000
    ];

    // 6-СЫНЫП ИНФОРМАТИКА СҰРАҚТАРЫ (ҚИЫНДЫҒЫ ӨСПЕЛІ)
    const questionsDatabase = [
        { q: "Ақпаратты енгізуге арналған негізгі құрылғы қайсы?", opts: ["Монитор", "Пернетақта", "Принтер", "Динамик"], ans: 1 },
        { q: "Графикалық ақпарат көзіне не жатады?", opts: ["Суреттер мен суреттемелер", "Дыбыстар мен әуендер", "Мәтіндік файлдар", "Программалық кодтар"], ans: 0 },
        { q: "Сыртқы жад құрылғысын тап:", opts: ["Жедел жад (ОЗУ)", "Процессор", "Флеш-карта (USB)", "Аналық плата"], ans: 2 },
        { q: "Клавишалардың ішіндегі ең ұзын батырма қайсы?", opts: ["Enter", "Shift", "Пробел (Space)", "Backspace"], ans: 2 },
        { q: "Компьютердің 'миы' деп нені атайды?", opts: ["Процессор", "Жаттау құрылғысы", "Монитор", "Қатқыл диск"], ans: 0 },
        { q: "Тізбектелген адымдардан тұратын іс-әрекеттер жиынтығы қалай аталады?", opts: ["Модель", "Алгоритм", "Ақпарат", "Файл"], ans: 1 },
        { q: "Бір байтта қанша бит бар?", opts: ["4 бит", "8 бит", "10 бит", "16 бит"], ans: 1 },
        { q: " Компьютерлік вирустардан қорғайтын арнайы бағдарлама:", opts: ["Браузер", "Антивирус", "Архиватор", "Редактор"], ans: 1 },
        { q: "Файлдарды реттеп сақтауға арналған 'қобдиша':", opts: ["Бума (Папка)", "Ярлык", "Бағдарлама", "Жүйелік блок"], ans: 0 },
        { q: "Интернетте сайттарды қарауға арналған бағдарлама:", opts: ["Операциялық жүйе", "Браузер", "Антивирус", "Текстік процессор"], ans: 1 },
        { q: "Екілік санау жүйесінде қандай цифрлар қолданылады?", opts: ["0 және 1", "1 және 2", "0, 1, 2", "1-ден 10-ға дейін"], ans: 0 },
        { q: "Ақпаратты өлшеудің ең кіші бірлігі қандай?", opts: ["Байт", "Бит", "Килобайт", "Мегабайт"], ans: 1 },
        { q: "Информатикадағы алгоритмнің графикалық түрі қалай аталады?", opts: ["Схема", "Блок-схема", "Сурет", "Диаграмма"], ans: 1 },
        { q: "Жасанды интеллект бағытының ағылшынша аббревиатурасы:", opts: ["IT", "AI", "IP", "OS"], ans: 1 },
        { q: "Компьютерлерді бір-бірімен байланыстыратын жүйе:", opts: ["Компьютерлік желі", "Шина", "Слот", "Интерфейс"], ans: 0 }
    ];

    // СҰРАҚТЫ АУЫСТЫРУҒА АРНАЛҒАН ҚОСАЛҚЫ СҰРАҚ
    const backupQuestion = {
        q: "Бас әріппен жазу үшін қай пернені басып тұру керек?",
        opts: ["Ctrl", "Alt", "Shift", "Tab"],
        ans: 2
    };

    let currentQIndex = 0;
    let playerName = "";
    let timerVal = 30;
    let timerInterval = null;
    let isAnswered = false;
    let currentQuestions = [];

    // DOM ELEMENTS
    const startScreen = document.getElementById('start-screen');
    const gameScreen = document.getElementById('game-screen');
    const endScreen = document.getElementById('end-screen');
    const playerNameInput = document.getElementById('player-name-input');
    const startBtn = document.getElementById('start-btn');
    const playerDisplayName = document.getElementById('player-display-name');
    const questionNumberEl = document.getElementById('question-number');
    const currentScoreEl = document.getElementById('current-score');
    const timerEl = document.getElementById('timer');
    const questionTextEl = document.getElementById('question-text');
    const optionBtns = document.querySelectorAll('.option-btn');
    const nextBtn = document.getElementById('next-btn');

    const life5050 = document.getElementById('life-5050');
    const lifePoll = document.getElementById('life-poll');
    const lifeSwap = document.getElementById('life-swap');
    const pollModal = document.getElementById('poll-modal');

    // GAME START
    startBtn.addEventListener('click', () => {
        playerName = playerNameInput.value.trim();
        if(!playerName) {
            alert('Өтініш, ойынды бастау үшін аты-жөніңізді енгізіңіз!');
            return;
        }

        playerDisplayName.innerText = playerName;
        currentQuestions = JSON.parse(JSON.stringify(questionsDatabase));
        currentQIndex = 0;

        // Reset Lifelines
        life5050.disabled = false;
        lifePoll.disabled = false;
        lifeSwap.disabled = false;

        startScreen.classList.add('hidden');
        endScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');

        loadQuestion();
    });

    function loadQuestion() {
        isAnswered = false;
        nextBtn.classList.add('hidden');
        
        const q = currentQuestions[currentQIndex];
        questionNumberEl.innerText = currentQIndex + 1;
        currentScoreEl.innerText = currentQIndex === 0 ? 0 : prizeMoney[currentQIndex - 1].toLocaleString();
        questionTextEl.innerText = q.q;

        optionBtns.forEach((btn, idx) => {
            btn.className = 'option-btn';
            btn.disabled = false;
            btn.querySelector('.opt-text').innerText = q.opts[idx];
        });

        startTimer();
    }

    function startTimer() {
        clearInterval(timerInterval);
        timerVal = 30;
        timerEl.innerText = timerVal;
        timerEl.parentElement.classList.remove('timer-warning');

        timerInterval = setInterval(() => {
            timerVal--;
            timerEl.innerText = timerVal;

            if(timerVal <= 5) {
                timerEl.parentElement.classList.add('timer-warning');
            }

            if(timerVal <= 0) {
                clearInterval(timerInterval);
                gameOver(false, "Уақыт таусылды!");
            }
        }, 1000);
    }

    // ANSWER SELECTION WITH ANIMATION
    optionBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            if(isAnswered) return;
            isAnswered = true;
            clearInterval(timerInterval);

            const selectedBtn = e.currentTarget;
            const selectedIdx = parseInt(selectedBtn.getAttribute('data-index'));
            const correctIdx = currentQuestions[currentQIndex].ans;

            selectedBtn.classList.add('selected');

            setTimeout(() => {
                selectedBtn.classList.remove('selected');

                if(selectedIdx === correctIdx) {
                    selectedBtn.classList.add('correct');
                    if(currentQIndex === 14) {
                        setTimeout(() => gameOver(true), 1200);
                    } else {
                        nextBtn.classList.remove('hidden');
                    }
                } else {
                    selectedBtn.classList.add('wrong');
                    optionBtns[correctIdx].classList.add('correct');
                    setTimeout(() => gameOver(false, "Қате жауап берілді!"), 1500);
                }
            }, 1200);
        });
    });

    nextBtn.addEventListener('click', () => {
        currentQIndex++;
        loadQuestion();
    });

    // LIFELINES LOGIC
    life5050.addEventListener('click', () => {
        const correctIdx = currentQuestions[currentQIndex].ans;
        let removed = 0;
        
        optionBtns.forEach((btn, idx) => {
            if(idx !== correctIdx && removed < 2) {
                btn.disabled = true;
                btn.style.opacity = '0.2';
                removed++;
            }
        });
        life5050.disabled = true;
    });

    lifePoll.addEventListener('click', () => {
        const correctIdx = currentQuestions[currentQIndex].ans;
        const pollBars = document.getElementById('poll-bars');
        pollBars.innerHTML = '';

        let percentages = [10, 10, 10, 10];
        percentages[correctIdx] = 60 + Math.floor(Math.random() * 15);
        let remain = 100 - percentages[correctIdx];
        
        for(let i=0; i<4; i++) {
            if(i !== correctIdx) {
                percentages[i] = Math.floor(remain / 3);
            }
        }

        const labels = ['A', 'B', 'C', 'D'];
        percentages.forEach((pct, idx) => {
            pollBars.innerHTML += `
                <div class="poll-bar-container">
                    <div>${labels[idx]}: ${pct}%</div>
                    <div class="poll-bar" style="width: ${pct}%;"></div>
                </div>
            `;
        });

        pollModal.style.display = 'flex';
        lifePoll.disabled = true;
    });

    document.getElementById('close-poll-btn').addEventListener('click', () => {
        pollModal.style.display = 'none';
    });

    lifeSwap.addEventListener('click', () => {
        currentQuestions[currentQIndex] = backupQuestion;
        loadQuestion();
        lifeSwap.disabled = true;
    });

    // GAME OVER / VICTORY
    function gameOver(isWin, reason = "") {
        clearInterval(timerInterval);
        gameScreen.classList.add('hidden');
        endScreen.classList.remove('hidden');

        document.getElementById('end-player-name').innerText = `Ойыншы: ${playerName}`;

        if(isWin) {
            document.getElementById('end-title').innerText = "🎉 ҚҰТТЫҚТАЙМЫЗ!\n🏆 СІЗ — ИНФОРМАТИКА МИЛЛИОНЕРІСІЗ!";
            document.getElementById('final-score-text').innerText = "1 000 000 ҰПАЙ";
            document.getElementById('correct-count-text').innerText = "Барлық 15 сұраққа дұрыс жауап бердіңіз!";
        } else {
            const earned = currentQIndex === 0 ? 0 : prizeMoney[currentQIndex - 1];
            document.getElementById('end-title').innerText = `ОЙЫН АЯҚТАЛДЫ! (${reason})`;
            document.getElementById('final-score-text').innerText = `${earned.toLocaleString()} ҰПАЙ`;
            document.getElementById('correct-count-text').innerText = `Сіз 15 сұрақтың ${currentQIndex}-іне дұрыс жауап бердіңіз.`;
        }
    }

    // RESTART & HOME
    document.getElementById('restart-btn').addEventListener('click', () => {
        endScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');
        currentQuestions = JSON.parse(JSON.stringify(questionsDatabase));
        currentQIndex = 0;
        life5050.disabled = false;
        lifePoll.disabled = false;
        lifeSwap.disabled = false;
        loadQuestion();
    });

    document.getElementById('home-btn').addEventListener('click', () => {
        endScreen.classList.add('hidden');
        startScreen.classList.remove('hidden');
        playerNameInput.value = '';
    });
</script>

</body>
</html>
